<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-labelledby="desc-granny">
  <!-- LOOP Original Vector Illustration: Classic Granny Square -->
  <!-- Designed for LOOP Crochet Learning Platform | Multi-color motif -->
  <title id="desc-granny">Illustration of a classic multi-color granny square motif</title>
  <rect width="320" height="240" rx="16" fill="#F4EFE6"/>
  
  <!-- Outer round: Sage -->
  <rect x="80" y="40" width="160" height="160" rx="12" fill="#7C9A6B"/>
  
  <!-- Outer clusters -->
  <g fill="#FAF7F0" opacity="0.3">
    <circle cx="100" cy="60" r="8"/>
    <circle cx="160" cy="54" r="8"/>
    <circle cx="220" cy="60" r="8"/>
    <circle cx="226" cy="120" r="8"/>
    <circle cx="220" cy="180" r="8"/>
    <circle cx="160" cy="186" r="8"/>
    <circle cx="100" cy="180" r="8"/>
    <circle cx="94" cy="120" r="8"/>
  </g>
  
  <!-- Middle round: Butter Yellow -->
  <rect x="105" y="65" width="110" height="110" rx="8" fill="#F5D87E"/>
  
  <!-- Inner round: Soft Pink -->
  <rect x="125" y="85" width="70" height="70" rx="6" fill="#E8B4B8"/>
  
  <!-- Center circle / Magic Ring -->
  <circle cx="160" cy="120" r="16" fill="#FAF7F0"/>
  <circle cx="160" cy="120" r="6" fill="#2D2D2D" opacity="0.15"/>
  
  <!-- Corner detail dashes -->
  <path d="M96 56 L112 72 M224 56 L208 72 M96 184 L112 168 M224 184 L208 168" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round"/>
</svg>

