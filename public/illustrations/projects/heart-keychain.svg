<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-labelledby="desc-heart">
  <!-- LOOP Original Vector Illustration: Heart Keychain -->
  <!-- Designed for LOOP Crochet Learning Platform | Puffy stuffed heart motif -->
  <title id="desc-heart">Illustration of an amigurumi stuffed crochet heart keychain</title>
  <rect width="320" height="240" rx="16" fill="#F4EFE6"/>
  
  <!-- Keyring & Loop at top -->
  <circle cx="160" cy="40" r="14" stroke="#2D2D2D" stroke-width="3" fill="none" opacity="0.6"/>
  <circle cx="160" cy="40" r="18" stroke="#2D2D2D" stroke-width="1.5" stroke-dasharray="2 3" fill="none" opacity="0.4"/>
  <!-- Connecting chain link -->
  <line x1="160" y1="54" x2="160" y2="72" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Drop shadow -->
  <path d="M164 88 C124 48 84 88 84 128 C84 164 134 194 164 214 C194 194 244 164 244 128 C244 88 204 48 164 88 Z" fill="#2D2D2D" fill-opacity="0.05"/>

  <!-- Puffy Crochet Heart (Coral-pink tone) -->
  <path d="M160 84 C120 44 80 84 80 124 C80 160 130 190 160 210 C190 190 240 160 240 124 C240 84 200 44 160 84 Z" fill="#E8B4B8"/>
  
  <!-- Spiral stitch texture lines on heart lobes -->
  <path d="M125 85 Q110 100 125 115 T140 135" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M195 85 Q210 100 195 115 T180 135" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M160 145 V185" stroke="#FAF7F0" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round" opacity="0.5"/>
</svg>

