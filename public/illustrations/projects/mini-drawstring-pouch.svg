<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-labelledby="desc-pouch">
  <!-- LOOP Original Vector Illustration: Mini Drawstring Pouch -->
  <!-- Designed for LOOP Crochet Learning Platform | Cylindrical pouch with mesh body -->
  <title id="desc-pouch">Illustration of a small crochet drawstring pouch</title>
  <rect width="320" height="240" rx="16" fill="#F4EFE6"/>
  
  <!-- Shadow under pouch base -->
  <ellipse cx="160" cy="208" rx="60" ry="12" fill="#2D2D2D" fill-opacity="0.06"/>
  
  <!-- Pouch Body (Sage Green #7C9A6B) -->
  <path d="M110 90 Q105 150 115 195 Q160 210 205 195 Q215 150 210 90 Q160 84 110 90 Z" fill="#7C9A6B"/>
  
  <!-- Pouch Top Ruffle -->
  <path d="M106 75 Q160 68 214 75 Q218 84 210 90 Q160 84 110 90 Q102 84 106 75 Z" fill="#698559"/>
  
  <!-- Mesh Stitch Grid texture -->
  <g stroke="#FAF7F0" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M118 115 Q160 110 202 115"/>
    <path d="M116 138 Q160 133 204 138"/>
    <path d="M117 162 Q160 157 203 162"/>
    <path d="M120 185 Q160 180 200 185"/>
    <!-- Vertical mesh lines -->
    <path d="M135 100 V198 M152 98 V202 M168 98 V202 M185 100 V198" stroke-dasharray="4 5"/>
  </g>
  
  <!-- Drawstring Cord & Beads (Butter Yellow #F5D87E) -->
  <path d="M120 86 Q160 92 200 86" stroke="#FAF7F0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Hanging cords -->
  <path d="M185 88 Q195 120 185 145" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="185" cy="148" r="5" fill="#F5D87E"/>
  
  <path d="M192 88 Q208 115 204 138" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="204" cy="141" r="5" fill="#F5D87E"/>
</svg>
