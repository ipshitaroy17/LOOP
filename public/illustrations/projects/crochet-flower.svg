<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-labelledby="desc-flower">
  <!-- LOOP Original Vector Illustration: Sweet Blossom Crochet Flower -->
  <!-- Designed for LOOP Crochet Learning Platform | 5-petal flower motif -->
  <title id="desc-flower">Illustration of a 5-petal dimensional crochet blossom</title>
  <rect width="320" height="240" rx="16" fill="#F4EFE6"/>
  
  <!-- Flower Group centered at (160, 120) -->
  <g transform="translate(160 120)">
    <!-- 5 Petals (Soft Pink #E8B4B8 & Cream details) -->
    <!-- Petal 1 (Top) -->
    <ellipse cx="0" cy="-44" rx="28" ry="34" fill="#E8B4B8"/>
    <path d="M0 -66 Q-10 -40 0 -24" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Petal 2 (Top Right) -->
    <g transform="rotate(72)">
      <ellipse cx="0" cy="-44" rx="28" ry="34" fill="#E8B4B8"/>
      <path d="M0 -66 Q-10 -40 0 -24" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Petal 3 (Bottom Right) -->
    <g transform="rotate(144)">
      <ellipse cx="0" cy="-44" rx="28" ry="34" fill="#E8B4B8"/>
      <path d="M0 -66 Q-10 -40 0 -24" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Petal 4 (Bottom Left) -->
    <g transform="rotate(216)">
      <ellipse cx="0" cy="-44" rx="28" ry="34" fill="#E8B4B8"/>
      <path d="M0 -66 Q-10 -40 0 -24" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Petal 5 (Top Left) -->
    <g transform="rotate(288)">
      <ellipse cx="0" cy="-44" rx="28" ry="34" fill="#E8B4B8"/>
      <path d="M0 -66 Q-10 -40 0 -24" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Flower Center (Butter Yellow #F5D87E) -->
    <circle cx="0" cy="0" r="26" fill="#F5D87E"/>
    <circle cx="0" cy="0" r="24" stroke="#FAF7F0" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
    <circle cx="0" cy="0" r="8" fill="#FAF7F0"/>
  </g>

  <!-- Small leaf accent -->
  <path d="M75 165 C60 140 85 125 105 135 C115 155 95 175 75 165 Z" fill="#7C9A6B"/>
  <path d="M78 162 Q92 148 102 138" stroke="#FAF7F0" stroke-width="1.5" fill="none"/>
</svg>
