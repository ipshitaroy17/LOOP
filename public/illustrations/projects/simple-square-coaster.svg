<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-labelledby="desc-coaster">
  <!-- LOOP Original Vector Illustration: Simple Square Coaster -->
  <!-- Designed for LOOP Crochet Learning Platform | Palette: Sage, Butter, Charcoal -->
  <title id="desc-coaster">Illustration of a textured square crochet mug coaster</title>
  <rect width="320" height="240" rx="16" fill="#F4EFE6"/>
  
  <!-- Soft drop shadow -->
  <rect x="88" y="52" width="144" height="144" rx="16" fill="#2D2D2D" fill-opacity="0.05"/>
  
  <!-- Outer border -->
  <rect x="84" y="48" width="144" height="144" rx="14" fill="#C3B1D4"/>
  
  <!-- Inner textured body -->
  <rect x="96" y="60" width="120" height="120" rx="8" fill="#FAF7F0"/>
  
  <!-- Half double crochet texture grid -->
  <g stroke="#7C9A6B" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M106 75 H206 M106 90 H206 M106 105 H206 M106 120 H206 M106 135 H206 M106 150 H206 M106 165 H206"/>
    <!-- Small vertical hatch loops -->
    <path d="M115 68 V172 M135 68 V172 M155 68 V172 M175 68 V172 M195 68 V172" stroke-dasharray="3 5"/>
  </g>
  
  <!-- Steaming mug outline icon on coaster -->
  <g transform="translate(136 94)" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" fill="none">
    <rect x="4" y="10" width="32" height="28" rx="6" fill="#FAF7F0"/>
    <path d="M36 18 C42 18 42 28 36 30"/>
    <path d="M12 2 Q14 -2 12 -6 M20 2 Q22 -2 20 -6" stroke-dasharray="2 3"/>
  </g>
</svg>
